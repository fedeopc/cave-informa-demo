<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cave Informa · Demo</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#E8EEF6;color:#1d2733;display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px;box-sizing:border-box}</style>
<script src="demo-config.js"></script>
</head>
<body>
<p id="msg">Carico l'app…</p>
<script>
/* Carica l'app vera e le aggiunge al volo il motore della demo (fascia, dati simulati, regia).
   L'app vera non viene modificata: le aggiunte esistono solo in questa pagina. */
(async function () {
  const base = (window.DEMO_CONFIG && DEMO_CONFIG.app) || "../allerta-cave/";
  const DEMO_SCRIPTS = '<script src="demo-comune.js"><\/script><script src="demo.js"><\/script>';
  function prepara(html) {
    let h = html;
    h = h.replace(/<title>[\s\S]*?<\/title>/i, "<title>Cave Informa · Demo</title>");
    h = h.replace(/<link[^>]+rel=["']manifest["'][^>]*>/gi, "");                       // non installabile
    h = h.replace(/navigator\.serviceWorker\.register\(/g, "(()=>Promise.resolve())(");  // niente funzionamento offline
    h = h.replace(/(<meta name="apple-mobile-web-app-title" content=")[^"]*/i, "$1Cave Demo");
    if (!/<head[^>]*>/i.test(h)) throw new Error("pagina non valida");
    return h.replace(/<head[^>]*>/i, (m) => m + '\n<meta name="robots" content="noindex">' + DEMO_SCRIPTS);
  }
  let html = null, fonte = "vera";
  try {
    const r = await fetch(base + "index.html?demo=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const t = await r.text();
    if (!/id="bcr-refresh"/.test(t)) throw new Error("app non riconosciuta");
    html = prepara(t);
  } catch (e) {
    console.warn("[demo] app vera non raggiungibile (" + base + "): uso la copia di riserva.", e);
    try { const r = await fetch("app-riserva.html", { cache: "no-store" }); html = await r.text(); fonte = "riserva"; }
    catch (e2) { document.getElementById("msg").textContent = "Non riesco a caricare l'app. Controlla la connessione e ricarica la pagina."; return; }
  }
  window.DEMO_FONTE = fonte;
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
